<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Earshot</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #232323;
        color: #e5e5e5;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      main { max-width: 640px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .hud { background: #000; color: #3cfa44; border-radius: 8px; padding: 12px; min-height: 64px;
        white-space: pre-wrap; font-size: 16px; }
      .stats { margin: 12px 0; font-size: 13px; color: #a7a7a7; white-space: pre-wrap; }
      .log { background: #2e2e2e; border: 1px solid #3e3e3e; border-radius: 8px; padding: 8px;
        font: 12px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
        max-height: 50vh; overflow: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>Earshot</h1>
      <div class="hud" id="hud">starting…</div>
      <div class="stats" id="stats"></div>
      <div class="log" id="log"></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
